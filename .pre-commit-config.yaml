# pre-commit hooks. Versions pinned via apps/backend/scanners.lock.
# Run `pre-commit install --hook-type pre-commit --hook-type pre-push` once.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: osv-scanner
        name: OSV-Scanner (deps CVE)
        entry: bash
        args:
          - -c
          - |
            if ! command -v osv-scanner >/dev/null 2>&1; then
              echo "osv-scanner not installed; skipping. Install: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2"
              exit 0
            fi
            osv-scanner --recursive --skip-git .
        language: system
        stages: [pre-push]
        pass_filenames: false
