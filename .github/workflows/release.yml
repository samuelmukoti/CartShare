name: Release

# Tag-driven release: push an annotated tag like `v1.0.0` on main and this
# workflow verifies the version, runs lint + tests, builds the installable
# plugin zip, and publishes a GitHub Release with the zip + checksum attached.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: cartshare

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches plugin version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^\s*\*\s*Version:' cartshare.php | awk '{print $NF}')
          constant=$(grep -m1 "define( 'CARTSHARE_VERSION'" cartshare.php | sed -E "s/.*'([^']+)' \);/\1/")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          fail=0
          for v in "$header" "$constant" "$stable"; do
            [ "$v" = "$tag" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Tag v$tag does not match plugin version (header=$header, CARTSHARE_VERSION=$constant, Stable tag=$stable)"
            exit 1
          fi
          grep -q "^= $tag =" readme.txt || { echo "::error::readme.txt changelog has no '= $tag =' entry"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install deps
        run: composer install --no-progress --no-interaction

      - name: Lint (WPCS)
        run: vendor/bin/phpcs .

      - name: Test
        run: vendor/bin/phpunit

  release:
    name: Build & Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/"$PLUGIN_SLUG"
          rsync -a --exclude-from=.distignore --exclude=build ./ build/"$PLUGIN_SLUG"/
          cd build
          zip -rq "$PLUGIN_SLUG-$VERSION.zip" "$PLUGIN_SLUG"
          sha256sum "$PLUGIN_SLUG-$VERSION.zip" > "$PLUGIN_SLUG-$VERSION.zip.sha256"
          unzip -l "$PLUGIN_SLUG-$VERSION.zip"

      - name: Extract changelog entry
        run: |
          # Pull the "= X.Y.Z =" block from readme.txt's Changelog section.
          awk -v v="$VERSION" '
            $0 == "= " v " =" { on = 1; next }
            on && (/^= / || /^== /) { exit }
            on { print }
          ' readme.txt > build/notes.md
          cat build/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            build/"$PLUGIN_SLUG-$VERSION.zip" \
            build/"$PLUGIN_SLUG-$VERSION.zip.sha256" \
            --title "CartShare $GITHUB_REF_NAME" \
            --notes-file build/notes.md \
            --generate-notes \
            --verify-tag \
            $prerelease
