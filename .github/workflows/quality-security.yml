name: Quality Security

# SAST, secrets, dependency, and filesystem checks on every PR and push to main.
# Versions pinned via apps/backend/scanners.lock.

on:
  push:
    branches: [001-cart-share-analytics-dashboard]
  pull_request:
    branches: [001-cart-share-analytics-dashboard]

permissions:
  contents: read
  security-events: write
  # gitleaks-action reads PR commits via the API to scope its scan; without
  # this it 403s ("Resource not accessible by integration") on pull_request.
  pull-requests: read

jobs:
  secrets:
    name: Gitleaks Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action prepends its own "v" to build the release tag, so
          # pass the bare version — "v8.21.2" yields a "vv..." tag
          # and a 404 on download.
          GITLEAKS_VERSION: 8.21.2
          # Skip the SARIF artifact upload — it hard-crashes the step when the
          # account's Actions artifact-storage quota is full, even when the
          # scan itself is clean. The scan still gates (non-zero on leaks).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.95.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep --config=auto --sarif --output semgrep.sarif --error

      - name: Upload Semgrep SARIF
        if: always()
        # Uploading to code scanning requires GitHub Advanced Security, which
        # most private repos don't have. Keep the upload best-effort — the
        # scan above (`--error`) is the real gate and still fails on findings.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  dependencies:
    name: OSV Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        # Pin a real tag — google/osv-scanner-action publishes v2.3.x, not a
        # floating "v2", so "@v2" fails to resolve.
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: --recursive .

  filesystem:
    name: Trivy Filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        # Code-scanning upload needs GitHub Advanced Security; keep it
        # best-effort so the check doesn't hard-fail on repos without it.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
